services:
  # ----------------------
  # Backend NestJS App
  # ----------------------
  nestapp:
    build: .
    container_name: nestjs-fullstack
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      - postgres-db
    volumes:
      - .:/app
      - /app/node_modules
    command: npm run start:dev

  # ----------------------
  # PostgreSQL Database
  # ----------------------
  postgres-db:
    image: postgres:15
    container_name: postgres-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: e-learning
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

# ----------------------
# Volume untuk menyimpan data DB
# ----------------------
volumes:
  pgdata:
